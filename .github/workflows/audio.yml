name: BitChord Audio APK

# Every push to main builds the phone app, signs it, and publishes it as a
# GitHub release named v1.9.<run number>, which the in-app updater picks up.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      AUDIO_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # The same key the hand-patched "BitChord Audio" builds were signed
      # with, so these install over them and keep the sign-in. It is the
      # widely published Android debug key: fine for a personal sideloaded
      # app, but swap it for a private key (kept in repository secrets)
      # before sharing builds with anyone.
      - name: Signing config
        run: |
          {
            echo "storeFile=ci/bitchord-audio.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleProdRelease --stacktrace 2>&1 | tee build.log

      # Compiler errors as annotations, readable from the API without the log.
      - name: Report compile errors
        if: failure()
        run: |
          # GitHub shows at most 10 error annotations per step, so the lines
          # that say what failed go first, as one annotation each.
          {
            grep -E '^e: |^ERROR|R8: |Missing class|error: ' build.log | grep -v 'incompatible version of Kotlin' | head -12
            awk '/What went wrong:/{f=1;n=0} f{print; n++} n>14{f=0}' build.log | head -30
          } | grep -v '^\s*$' | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # The fork's own unit tests (tag reading, Liked Music merge). Reported,
      # but a failure here doesn't hold back the APK.
      - name: Fork tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testProdReleaseUnitTest --tests 'com.music.bitchord.AudioForkTest' --tests 'com.music.bitchord.CoverTagsTest' 2>&1 | tee test.log || {
            # Which tests failed, and why, as annotations on the run.
            grep -hE '(AudioForkTest|CoverTagsTest) > .* FAILED|expected:|AssertionError|Exception' test.log app/build/test-results/testProdReleaseUnitTest/*.xml 2>/dev/null \
              | head -20 | while IFS= read -r line; do echo "::warning::${line:0:300}"; done
            exit 1
          }

      - name: Collect APKs
        run: |
          mkdir -p out
          v="1.9.${AUDIO_BUILD_NUMBER}"
          for f in app/build/outputs/apk/prod/release/*.apk; do
            case "$(basename "$f")" in
              *unsigned*) echo "::error::$f is unsigned; it would not install" ;;
              *arm64-v8a*) cp "$f" "out/BitChord-v${v}_arm64-v8a.apk" ;;
            esac
          done
          ls -l out
          test -n "$(ls out)"
          # Never publish an APK Android would refuse: it must carry our key.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            "$apksigner" verify --print-certs "$f" | tee /dev/stderr | grep -qi '1e08a903aef9c3a721510b64ec764d01d3d094eb954161b62544ea8f187b5953' \
              || { echo "::error::$f is not signed with the BitChord Audio key"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Audio-${{ github.run_number }}
          path: out/*.apk

      # Patch updates: the new APK as a binary patch (bsdiff) from each of the
      # last three releases, plus its SHA-256. The app rebuilds the APK from
      # the one it is installed from and checks it against the hash, falling
      # back to the full APK when there is no patch from its version.
      - name: Make update patches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq bsdiff >/dev/null
          v="1.9.${AUDIO_BUILD_NUMBER}"
          new="out/BitChord-v${v}_arm64-v8a.apk"
          sha256sum "$new" | cut -d' ' -f1 > "${new}.sha256"
          for tag in $(gh api "repos/${{ github.repository }}/releases?per_page=3" --jq '.[].tag_name'); do
            rm -rf old && mkdir old
            gh release download "$tag" -R "${{ github.repository }}" -p '*_arm64-v8a.apk' -D old || continue
            o=$(ls old/*.apk 2>/dev/null | head -1)
            [ -f "$o" ] || continue
            patch="out/BitChord-v${v}_arm64-v8a-from-${tag}.bspatch"
            bsdiff "$o" "$new" "$patch"
            echo "::notice::Update patch from ${tag}: $(( $(stat -c%s "$patch") / 1024 )) KB instead of $(( $(stat -c%s "$new") / 1024 )) KB"
          done
          ls -l out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.${{ github.run_number }}
          name: BitChord Audio 1.9.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/*.apk
            out/*.sha256
            out/*.bspatch
